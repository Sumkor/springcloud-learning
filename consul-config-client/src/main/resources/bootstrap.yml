server:
  port: 9101
spring:
  application:
    name: consul-config-client
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        serviceName: consul-config-client
      config:
        enabled: true #是否启用配置中心功能
        format: yaml #设置配置值的格式
        prefix: config #设置配置所在目录
        profile-separator: ':' #设置 profile 的分隔符
        data-key: data #配置 key 的名字
        # 这里的配置，能读取到远程配置 key='config/consul-config-client:dev/data' 对应的 value