server:
  port: 9201
spring:
  application:
    name: api-gateway
  cloud:
    gateway:

      # 访问 http://localhost:9201/user-service/user/1 可以路由到 user-service 的 http://localhost:8201/user/1
      discovery:
        locator:
          enabled: true #开启从注册中心动态创建路由的功能
          lower-case-service-id: true #使用小写服务名，默认是大写

      # 访问 http://localhost:9201/user/1 可以路由到 user-service 的 http://localhost:8201/user/1
      routes:
        - id: loadbalance_route
          uri: lb://user-service #此处需要使用lb协议
          predicates:
            - Method=GET

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8001/eureka/
logging:
  level:
    org.springframework.cloud.gateway: debug